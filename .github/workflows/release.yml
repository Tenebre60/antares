# Publishes a new Antares version on GitHub Releases when the version in package.json changes.
# The installed browsers download it automatically (electron-updater checks the SHA-512 in latest.yml).
name: Publicar versão
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  verificar:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then echo "publish=false" >> "$GITHUB_OUTPUT"; echo "A versão $V já foi publicada."; else echo "publish=true" >> "$GITHUB_OUTPUT"; fi
  testes:
    needs: verificar
    if: needs.verificar.outputs.publish == 'true'
    uses: ./.github/workflows/test.yml
    with:
      ref: main
  windows:
    needs: [verificar, testes]
    if: needs.verificar.outputs.publish == 'true'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Montar e publicar o instalador
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-win.js --publish
      - name: Conferir proteções do executável
        shell: bash
        run: |
          npx @electron/fuses read --app dist/win-unpacked/Antares.exe | tee fuses.txt
          grep -q "RunAsNode is Disabled" fuses.txt
          grep -q "EnableEmbeddedAsarIntegrityValidation is Enabled" fuses.txt
          grep -q "OnlyLoadAppFromAsar is Enabled" fuses.txt
