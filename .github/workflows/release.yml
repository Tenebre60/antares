# Publishes a new Antares version on GitHub Releases when the version in package.json changes.
# The installed browsers download it automatically (electron-updater checks the SHA-512 in latest.yml).
name: Publicar versão
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  verificar:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # a version counts as published only if it is public and has latest.yml (what the browsers read)
          INFO=$(gh release view "v$V" --json isDraft,assets --jq '[.isDraft, ([.assets[].name] | index("latest.yml") != null)] | @tsv' 2>/dev/null || true)
          if [ "$INFO" = "$(printf 'false\ttrue')" ]; then echo "publish=false" >> "$GITHUB_OUTPUT"; echo "A versão $V já foi publicada."; else echo "publish=true" >> "$GITHUB_OUTPUT"; fi
  testes:
    needs: verificar
    if: needs.verificar.outputs.publish == 'true'
    uses: ./.github/workflows/test.yml
    with:
      ref: main
  windows:
    needs: [verificar, testes]
    if: needs.verificar.outputs.publish == 'true'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Marcar a versão (tag)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v${{ needs.verificar.outputs.version }}"
          # an incomplete release of this version (without latest.yml) is removed and made again
          if gh release view "$V" >/dev/null 2>&1; then gh release delete "$V" --yes; fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/$V" >/dev/null; then
            git tag "$V" && git push origin "$V"
          fi
      - name: Montar e publicar o instalador
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-win.js --publish
      - name: Tornar a versão pública (só depois de enviar todos os arquivos)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v${{ needs.verificar.outputs.version }}"
          gh release view "$V" --json assets --jq '.assets[].name' | tee assets.txt
          grep -qx latest.yml assets.txt
          grep -q "Antares-Setup-.*\.exe$" assets.txt
          gh release edit "$V" --draft=false --latest
      - name: Conferir proteções do executável
        shell: bash
        run: |
          npx @electron/fuses read --app dist/win-unpacked/Antares.exe | tee fuses.txt
          grep -q "RunAsNode is Disabled" fuses.txt
          grep -q "EnableEmbeddedAsarIntegrityValidation is Enabled" fuses.txt
          grep -q "OnlyLoadAppFromAsar is Enabled" fuses.txt
