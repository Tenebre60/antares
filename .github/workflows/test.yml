# Runs every test suite on each change. A version is only published when these pass.
name: Testes
on:
  push:
    branches: [main]
    paths-ignore: [package.json]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Ferramentas de teste (tela virtual, gerenciador de janelas)
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox xdotool imagemagick python3-xlib fonts-noto-color-emoji
      - run: npm ci
      - name: Montar o Antares (Linux, só para testar)
        run: npm run build:linux
      - name: Rodar os testes
        run: |
          Xvfb :99 -screen 0 1400x900x24 &
          sleep 2
          DISPLAY=:99 openbox &
          sleep 1
          npm test
      - name: Guardar registros e capturas (só quando algo falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registros-dos-testes
          path: |
            /tmp/*.png
            /tmp/*.log
          if-no-files-found: ignore
          retention-days: 7
